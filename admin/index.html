<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Akvarell – kezelő</title>
<link rel="stylesheet" href="/style.css?v=220405a5">
<style>
/* a kezelő a vendégoldal stílusát használja; ezek a különbségek (a fejléc itt nem lebeg, a .sor itt lista, nem lapozó sor) */
body{padding-bottom:24px}
.fej{position:sticky;background:var(--lap);box-shadow:0 1px 0 var(--vonal)}
.fej .logo{color:var(--tus);text-shadow:none}
main.admin{max-width:760px;margin:0 auto;padding:4px 14px 32px}
.admin .sor{display:block;overflow:visible;padding:12px 0;margin:0;grid-auto-flow:unset}
.admin .blokk h2{font-size:22px;margin-bottom:8px}
.ful{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.fo-ful{gap:5px}.fo-ful button{font-weight:700;font-size:15px;padding:8px 11px}.al-ful{margin-top:-4px;padding-top:10px;border-top:1px solid var(--vonal)}.al-ful button{font-size:15px;padding:6px 12px}
.lepes{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:2px 8px;width:100%;text-align:left;min-height:56px;border:1px solid var(--vonal);background:#fff;border-radius:14px;padding:12px 14px;margin:10px 0;font:inherit;color:inherit;align-items:center}
.lepes b{grid-column:1}.lepes span{grid-column:1;font-size:14px;color:var(--halk);line-height:1.4}.lepes i{grid-column:2;grid-row:1/3;font-style:normal;font-size:22px;color:var(--duna);text-align:right}
button.lepes{cursor:pointer}div.lepes{background:var(--papir)}
.admin .blokk h3{font-size:16px;margin:14px 0 2px;color:var(--halk);font-family:inherit;font-weight:700}
.arsor{display:block;font-size:14px;color:var(--halk);margin-top:4px;font-weight:400}.arsor small{white-space:nowrap}
.admin .naptar .fejl button{min-width:48px;min-height:48px}
.admin .napok{grid-template-columns:repeat(7,minmax(0,1fr))}.admin .napok button{aspect-ratio:auto;min-width:0;min-height:44px}
.ful button{min-height:44px;border:1px solid var(--vonal,#ccc);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;white-space:nowrap}
.ful button.most{background:var(--duna,#2d5f7a);color:#fff;border-color:transparent}
.sor{border-bottom:1px solid #e5e0d6;padding:12px 0}
.sor:last-child{border:0}
.gombok{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.gombok button{min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;font:inherit}
.allapot{font-size:13px;padding:2px 8px;border-radius:999px;background:#eee}
.allapot.uj{background:#fde9c8}.allapot.visszaigazolva{background:#d6eedc}.allapot.elutasitva{background:#f3d6d6}
.mentve{font-size:13px;color:#2e7d4f;margin-left:8px}
.merok{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.merok div{background:var(--papir);border-radius:14px;padding:12px}
.merok small{display:block;font-size:13px;color:var(--halk);line-height:1.3}
.merok b{font-size:22px}
.merok .jo b{color:var(--zold)}.merok .rossz b{color:var(--piros)}
.honapok{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.honapok button,.gombok button.most,#pz-tip button{min-height:44px;border:1px solid var(--vonal);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;white-space:nowrap}
.honapok button.most,#pz-tip button.most{background:var(--duna);color:#fff;border-color:transparent}
.sav-sor{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:2px 10px;align-items:center;margin:8px 0}
.sav-sor span{grid-column:1/3;font-size:14px}
.sav-sor i{display:block;height:12px;border-radius:6px;background:var(--duna)}.sav-sor i.kiadas{background:var(--okker)}
.sav-sor b{text-align:right;font-size:14px}
.penzsor{display:flex!important;justify-content:space-between;gap:10px;align-items:flex-start}
.penzsor button{min-width:44px;min-height:44px;border:1px solid var(--vonal);background:#fff;border-radius:10px;font-size:20px}
.qr-elo{width:180px;margin:10px 0}.qr-elo svg{width:100%;height:auto;display:block}
select{width:100%;min-height:48px;border:1px solid var(--vonal);border-radius:12px;padding:8px 12px;background:#fff;font:inherit}
.gombok button.gomb{background:var(--tus);color:#fff;border-color:transparent;border-radius:999px;padding:8px 18px}
#bf label{display:block;margin:12px 0;font-size:15px}#bf input[type=password],#bf input[type=text]{display:block;width:100%;min-height:52px;border:1px solid var(--vonal);border-radius:12px;padding:10px 14px;font:inherit;font-size:18px;background:#fff;margin-top:6px}
#bf label.pipa{display:flex;gap:10px;align-items:center;min-height:44px}#bf label.pipa input{width:22px;height:22px}
#bf input[hidden]{display:none}.uzenet:empty{display:none}
.apro{font-size:14px;color:var(--halk)}
.adminkep{width:100%;max-width:320px;border-radius:10px;display:block}
</style>
</head>
<body>
<header class="fej"><div class="belso"><a class="logo" href="/">Akvarell</a><span class="jelmag">kezelő</span></div></header>
<main id="fo" class="admin"><p>Betöltés…</p></main>
<script src="/vendor/qrcode.js?v=e84be42f"></script>
<script src="/admin/admin.js?v=b985cde9"></script>
</body>
</html>
