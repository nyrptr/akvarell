# Napi élő ellenőrzés: ha a vendégoldal vagy az adatbázis nem válaszol, a futás piros lesz, és a GitHub e-mailt küld a tároló gazdájának.
# Titok nem kell hozzá. A cím a tároló SITE_URL változójából jön (Settings → Variables), alapból akvarell.pages.dev.
name: Napi ellenőrzés
on:
  # 05:17 UTC: teljes ellenőrzés. A 08:23 és 14:23 UTC-s futás a vendégút-leveleket is elindítja (azok 8–20 óra között mennek,
  # és az /api/adat kérése indítja őket) – így akkor is kimennek, ha aznap senki nem nyitja meg az oldalt.
  schedule: [{ cron: '17 5 * * *' }, { cron: '23 8 * * *' }, { cron: '23 14 * * *' }]
  workflow_dispatch:
jobs:
  el:
    runs-on: ubuntu-latest
    steps:
      - name: Oldal és adatbázis
        env: { SITE: "${{ vars.SITE_URL || 'https://akvarell.pages.dev' }}" }
        run: |
          set -e
          curl -fsS "$SITE/" -o /dev/null
          curl -fsS "$SITE/api/adat" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['apartmanok'])>=1, 'nincs apartman'; print('apartman:', len(d['apartmanok']))"
          curl -fsS "$SITE/api/zebegeny" -o /dev/null || echo "::warning::Duna/időjárás most nem érhető el (külső forrás)"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/admin/api/en"); case "$code" in 401|302|403) ;; *) echo "::error::A kezelő belépés nélkül $code választ ad (401, 302 vagy 403 kellene)"; exit 1;; esac
          curl -fsS "$SITE/kepek/Bereny-apartman-nappali.jpg" -o /dev/null   # a saját képmásolat elérhető
          # Ernő saját oldala (tőle már nem függünk, de ha áll, neki foglalást veszít): csak figyelmeztetés
          curl -fsS -m 20 -o /dev/null https://akvarellzebegeny.hu/ || echo "::warning::Ernő oldala (akvarellzebegeny.hu) most nem érhető el – szólni neki"
          echo "rendben"
